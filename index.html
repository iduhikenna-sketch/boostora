<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTBoost</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1020;color:#fff;padding-bottom:80px}
.header{display:flex;justify-content:space-between;padding:15px 20px;background:#0f1a33}
.logo{color:#ff2d5a;font-weight:900}
.coin{background:#1a2a4a;padding:5px 12px;border-radius:20px;border:1px solid #2a3a5a}
.avatar{width:180px;height:180px;border-radius:50%;margin:30px auto 10px;padding:3px;background:linear-gradient(135deg,#ff2d5a,#8a2be2)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.user{text-align:center;margin:10px 0 20px}
.btns{display:flex;gap:15px;justify-content:center;margin:20px}
.btn{padding:12px 30px;border-radius:25px;border:none;font-weight:700}
.skip{background:#1a2a4a;color:#fff;border:1px solid #2a3a5a}
.follow{background:#ff2d5a;color:#fff}
.tips{background:#111d36;margin:20px;border-radius:15px;padding:15px;border:1px solid #1a2a4a;font-size:13px}
.tabRow{display:flex;background:#111d36;margin:15px;border-radius:12px;padding:5px}
.tab{flex:1;text-align:center;padding:12px;border-radius:10px;color:#6b7a99}
.tab.active{background:#ffcc00;color:#000;font-weight:700}
.service{background:#111d36;margin:10px 15px;padding:14px;border-radius:12px;display:flex;justify-content:space-between;border:1px solid #1a2a4a}
.pill{padding:6px 14px;border-radius:20px;border:none;font-weight:700}
.red{background:#ff2d5a;color:#fff} .blue{background:#0a84ff;color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f1a33;border-top:1px solid #1a2a4a;padding:10px 0;justify-content:space-around}
.nav{color:#6b7a99;text-align:center;font-size:12px} .nav.active{color:#ffcc00}
</style>
</head>
<body>
<div class="header"><div class="logo">TTBoost</div><div class="coin">🪙 <span id="c">3</span></div></div>

<div id="p-home">
 <div class="avatar"><img id="av" src="https://i.pravatar.cc/300?img=5"></div>
 <div class="user" id="un">@heckler_the_klown</div>
 <div class="btns"><button class="btn skip" onclick="skip()">Skip</button><button class="btn follow" onclick="follow()">Follow +5 🪙</button></div>
 <div class="tips">
  <b>Tips</b><br><br>1 Click the button 2 Open Official App<br>3 Give follow/like 4 Back to TTBoost<br>5 Get Coins<br><br><span style="color:#ff5a5a;font-size:11px">Unfollow after completing a task may lead to coin loss.</span>
 </div>
</div>

<div id="p-store" style="display:none">
 <div style="padding:15px 20px;font-size:20px;font-weight:800">Store</div>
 <div class="tabRow"><div class="tab active" id="tP" onclick="sw('Profile')">Profile</div><div class="tab" id="tV" onclick="sw('Video')">Video</div></div>
 <div id="list"></div>
</div>

<div id="p-more" style="display:none"><div style="padding:15px 20px;font-size:20px;font-weight:800">More - Same as your video</div><div class="service"><span>Wallet & Fund Account</span><span>›</span></div><div class="service"><span>My Orders</span><span>›</span></div><div class="service"><span>Coin History</span><span>›</span></div></div>

<div class="bottom">
 <div class="nav active" id="n-home" onclick="go('home')">🏠<br>Home</div>
 <div class="nav" id="n-store" onclick="go('store')">🛍️<br>Store</div>
 <div class="nav" id="n-more" onclick="go('more')">☰<br>More</div>
</div>

<script>
let coins=parseInt(localStorage.getItem('coins')||'3'); document.getElementById('c').innerText=coins;
let users=['@heckler_the_klown','@g_zes','@leeminho','@amara_lagos','@boostora']; let i=0;
let data={Profile:[['+200','','100'],['+400','17% OFF','200'],['+900','26% OFF','400'],['+2000','33% OFF','1000'],['+4300','38% OFF','2000'],['+9000','44% OFF','4000']],Video:[['+300','','80'],['+600','17% OFF','240'],['+1300','25% OFF','800'],['+2700','29% OFF','1600'],['+5600','33% OFF','4000'],['+11500','39% OFF','8000']]};
let cur='Profile';
function go(p){document.getElementById('p-home').style.display=p=='home'?'block':'none';document.getElementById('p-store').style.display=p=='store'?'block':'none';document.getElementById('p-more').style.display=p=='more'?'block':'none';document.querySelectorAll('.nav').forEach(e=>e.classList.remove('active'));document.getElementById('n-'+p).classList.add('active');if(p=='store')render();}
function sw(t){cur=t;document.getElementById('tP').classList.toggle('active',t=='Profile');document.getElementById('tV').classList.toggle('active',t=='Video');render();}
function render(){let l=data[cur];document.getElementById('list').innerHTML=l.map(s=>`<div class="service"><span>${cur=='Profile'?'👤':'❤️'} ${s[0]} <small style="color:#6b7a99">${s[1]}</small></span><span><button class="pill red">${cur=='Profile'?'$'+(s[0].replace('+','')*0.01+2).toFixed(2):'$'+(s[0].replace('+','')*0.006).toFixed(2)}</button> <button class="pill blue" onclick="buy(${s[2]})">${s[2]} 🪙</button></span></div>`).join('');}
function skip(){i=(i+1)%users.length;document.getElementById('un').innerText=users[i];document.getElementById('av').src='https://i.pravatar.cc/300?img='+(5+i);}
function follow(){coins+=5;localStorage.setItem('coins',coins);document.getElementById('c').innerText=coins;alert('Followed '+document.getElementById('un').innerText+' +5 coins!');skip();}
function buy(cost){if(coins<cost){alert('Not enough coins! Follow to earn.');go('home');return;}coins-=cost;localStorage.setItem('coins',coins);document.getElementById('c').innerText=coins;alert('Order placed! -'+cost+' coins');}
render();
</script>
</body>
</html>
