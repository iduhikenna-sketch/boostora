  <defs>

        <feMergeNode in="blur"/>

  <!-- Golden glowing staircase arrow -->
  <path

  <!-- Bright inner arrow -->
  <path
    d="M8 88
       L38 88 L38 72
       L72 72 L72 53
       L108 53 L108 38
       L145 38 L145 23
